name: Deploy to Dev VPS

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "reset.sh"
      - "makefile"
      - "**.md"
      - "docs/**"
      - ".github/**"
    tags-ignore:
      - "**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ${{ secrets.SSH_PRIVATE_KEY_FILE }}
          chmod 600 ${{ secrets.SSH_PRIVATE_KEY_FILE }}
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dev VPS
        run: |
          ssh -i ${{ secrets.SSH_PRIVATE_KEY_FILE }} -p ${{ secrets.SSH_PORT }} -v ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /home/recep/application/self-hosted-supabase-docker
            git pull origin dev
            docker compose -f docker-compose.dev.yml down
            docker compose -f docker-compose.dev.yml build --no-cache
            docker compose -f docker-compose.dev.yml up -d
            docker system prune -f
          EOF
